<div class="match-detail-page">
  <div class="top-section">
    <div>
      <span class="badge-title"> FUT RANK AI </span>
      <h1>
        {{ match.teamA }}
        <span> vs </span>
        {{ match.teamB }}
      </h1>
    </div>
    <button
      class="finish-btn"
      (click)="finishMatch()"
      [disabled]="
        match.finished || (authService.currentUser | async)?.role !== 'captain'
      "
    >
      @if (match.finished) {
        🔒 Partido Finalizado
      } @else {
        ✅ Finalizar Partido
      }
    </button>
  </div>

  <div class="score-board">
    <div class="team-side">
      <h2>
        {{ match.teamA }}
      </h2>

      <strong>
        {{ match.scoreA }}
      </strong>
    </div>
    <span class="vs-text"> VS </span>
    <div class="team-side">
      <h2>
        {{ match.teamB }}
      </h2>

      <div class="enemy-score-wrapper">
        <button
          [disabled]="(authService.currentUser | async)?.role !== 'captain'"
          class="enemy-btn"
          (click)="decreaseEnemyScore()"
        >
          <i class="bi bi-dash-lg"></i>
        </button>

        <div class="enemy-score">
          {{ match.scoreB }}
        </div>

        <button
          [disabled]="(authService.currentUser | async)?.role !== 'captain'"
          class="enemy-btn"
          (click)="increaseEnemyScore()"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
      </div>
    </div>
  </div>

  <div class="players-grid">
    @for (player of match.players; track player.playerId) {
      <div class="player-card">
        <img [src]="player.photo" />
        <h3>
          {{ player.name }}
        </h3>
        <span>
          {{ player.position }}
        </span>
        <div class="team-badge">
          Equipo
          {{ player.team }}
        </div>
        <div class="stats-section">
          <div class="stat-card">
            <label> ⚽ Goles </label>
            <div class="controls">
              <button
                [disabled]="
                  (authService.currentUser | async)?.role !== 'captain'
                "
                (click)="decreaseGoals(player)"
              >
                -
              </button>
              <strong>
                {{ player.goals }}
              </strong>
              <button
                [disabled]="
                  (authService.currentUser | async)?.role !== 'captain'
                "
                (click)="increaseGoals(player)"
              >
                +
              </button>
            </div>
          </div>
          <div class="stat-card">
            <label> 🎯 Assists </label>
            <div class="controls">
              <button
                [disabled]="
                  (authService.currentUser | async)?.role !== 'captain'
                "
                (click)="decreaseAssists(player)"
              >
                -
              </button>
              <strong>
                {{ player.assists }}
              </strong>
              <button
                [disabled]="
                  (authService.currentUser | async)?.role !== 'captain'
                "
                (click)="increaseAssists(player)"
              >
                +
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
