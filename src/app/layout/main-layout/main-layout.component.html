<div class="layout-container">

    <!-- SIDEBAR -->

    <aside class="sidebar" [class.open]="sidebarOpen">

        <!-- LOGO -->

        <div class="logo-section">

            <div class="logo-circle">
                ⚽
            </div>

            <div>
                <h2>
                    FUT RANK
                </h2>

                <span>
                    AI Platform
                </span>
            </div>

        </div>

        <!-- MENU -->

        <nav class="menu">

            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">

                🏠 Dashboard

            </a>

            <a routerLink="/rate-players" routerLinkActive="active">

                ⭐ Calificar

            </a>

            <a routerLink="/player-profile" routerLinkActive="active">

                👤 Jugadores

            </a>

            <a routerLink="/create-match" routerLinkActive="active">

                ⚽ Partidos

            </a>

            <a routerLink="/rankings" routerLinkActive="active">

                🏆 Rankings

            </a>

            <a routerLink="/team-builder" routerLinkActive="active">

                🧠 Team Builder

            </a>

            <a routerLink="/match-history" routerLinkActive="active">

                📜 Historial

            </a>

        </nav>

    </aside>

    <!-- CONTENT -->

    <main class="content-area">

        <!-- TOPBAR -->

        <header class="topbar">

            <button class="menu-btn" (click)="toggleSidebar()">

                ☰
            </button>

            <div>

                <h3>
                    {{ ((authService.currentUser | async)?.displayName || '').toUpperCase() }} 👋
                </h3>

                <span>
                    Temporada 2026
                </span>

            </div>

            <div class="profile-section">

                <img [src]="(authService.currentUser | async)?.photoURL">

                <button class="logout-btn" (click)="logout()">

                    🚪

                </button>

            </div>

        </header>

        <!-- ROUTER -->

        <div class="router-container">

            <router-outlet></router-outlet>

        </div>

    </main>

</div>
